[phases.setup]
nixPkgs = ["...", "ffmpeg", "python3", "pkg-config", "cairo", "pango", "libjpeg", "giflib", "librsvg", "pixman"]
aptPkgs = ["libcairo2-dev", "libpango1.0-dev", "libjpeg-dev", "libgif-dev", "librsvg2-dev"]

[phases.install]
cmds = [
  "npm ci --include=optional || npm install",
  "pip3 install -U yt-dlp --break-system-packages",
  "ffmpeg -version",
  "python3 -m yt_dlp --version"
]

[start]
cmd = "npm start"
